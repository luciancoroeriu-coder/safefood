<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SafePro - Siguranța Ta</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root { --bg: #0A0A0C; --card: #16161D; --green: #00D68F; --red: #FF4757; --text: #FFFFFF; --dim: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
        
        header { padding: 30px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: var(--green); }

        .content { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* Cardul de Instrucțiuni */
        .info-card { background: rgba(0, 214, 143, 0.05); border: 1px solid rgba(0, 214, 143, 0.2); border-radius: 20px; padding: 15px; margin-bottom: 20px; }
        .info-card h4 { color: var(--green); font-size: 0.9rem; margin-bottom: 8px; text-transform: uppercase; }
        .steps { font-size: 0.85rem; color: #ccc; line-height: 1.5; }

        /* Butonul Principal */
        .main-btn { 
            width: 100%; background: var(--green); color: #000; border: none; 
            border-radius: 18px; padding: 20px; font-weight: 800; font-size: 1rem; 
            box-shadow: 0 8px 15px rgba(0, 214, 143, 0.2); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* Camera Overlay */
        #scanner-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        .reticle { width: 260px; height: 160px; border: 2px solid var(--green); border-radius: 20px; box-shadow: 0 0 0 5000px rgba(0,0,0,0.7); }
        .close-btn { position: absolute; bottom: 50px; background: #fff; color: #000; padding: 12px 35px; border-radius: 30px; font-weight: bold; pointer-events: auto; border: none; }

        /* Rezultate și Erori */
        .result { background: var(--card); border-radius: 24px; padding: 25px; margin-top: 25px; border: 1px solid rgba(255,255,255,0.1); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .error-title { color: var(--red); font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .grade-badge { display: inline-block; padding: 4px 12px; border-radius: 6px; font-weight: 900; background: var(--green); color: #000; font-size: 1.2rem; margin-bottom: 10px; }
        .ing-box { font-size: 0.9rem; color: #BBB; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

<header>
    <div class="logo">Safe<span>Pro</span></div>
    <div style="font-size: 0.7rem; background: #222; padding: 4px 8px; border-radius: 5px; color: var(--green);">v2.1</div>
</header>

<div class="content">
    <div class="info-card">
        <h4>🛡️ Cum funcționează?</h4>
        <div class="steps">
            1. Apasă pe butonul de scanare.<br>
            2. Îndreaptă camera spre codul de bare al produsului.<br>
            3. Află imediat ce ingrediente conține și cât e de sigur.
        </div>
    </div>

    <button class="main-btn" onclick="openCam()">
        <span>📷</span> SCANEAZĂ COD BARE
    </button>
    
    <div style="margin-top: 15px; display: flex; gap: 8px;">
        <input type="number" id="codeIn" style="flex:1; background:#111; border:1px solid #333; padding:15px; border-radius:12px; color:#fff;" placeholder="Cod manual...">
        <button onclick="fetchData(document.getElementById('codeIn').value)" style="background:#222; color:#fff; border:none; padding:15px; border-radius:12px; font-weight:bold;">GO</button>
    </div>

    <div id="out"></div>
</div>

<div id="scanner-container">
    <div id="interactive" class="viewport"></div>
    <div class="overlay">
        <div class="reticle"></div>
        <p style="color:#fff; margin-top:20px; font-weight: bold;">CADREAZĂ CODUL DE BARE</p>
        <button class="close-btn" onclick="closeCam()">ÎNCHIDE</button>
    </div>
</div>

<script>
    function openCam() {
        document.getElementById('scanner-container').style.display = 'block';
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#interactive'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "ean_8_reader", "upc_reader", "code_128_reader"] }
        }, (err) => { if(!err) Quagga.start(); });
        Quagga.onDetected((res) => { closeCam(); fetchData(res.codeResult.code); });
    }

    function closeCam() { Quagga.stop(); document.getElementById('scanner-container').style.display = 'none'; }

    async function fetchData(code) {
        if(!code) return;
        const out = document.getElementById('out');
        out.innerHTML = `<div class="result" style="text-align:center;">🔍 Căutăm informații despre <b>${code}</b>...</div>`;

        const url = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,ingredients_text,ingredients_text_ro,nutrition_grades`;

        try {
            const r = await fetch(url);
            const d = await r.json();

            if (d.status === 1) {
                const p = d.product;
                const grade = (p.nutrition_grades || "N/A").toUpperCase();
                out.innerHTML = `
                    <div class="result">
                        <div class="grade-badge">Scor: ${grade}</div>
                        <h2 style="margin-bottom:5px;">${p.product_name || 'Produs Necunoscut'}</h2>
                        <p style="color:var(--green); font-weight:bold; font-size:0.9rem;">${p.brands || 'Brand indisponibil'}</p>
                        <div class="ing-box">
                            <strong>📋 Ingrediente detectate:</strong><br>
                            ${p.ingredients_text_ro || p.ingredients_text || 'Lista de ingrediente nu este disponibilă pentru acest cod.'}
                        </div>
                    </div>`;
            } else {
                out.innerHTML = `
                    <div class="result">
                        <div class="error-title">❌ Produs Negăsit</div>
                        <p style="font-size:0.9rem; color:#ccc;">Codul <b>${code}</b> nu a putut fi identificat în bazele de date de alimente sau cosmetice.</p>
                        <div style="margin-top:15px; font-size:0.8rem; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px;">
                            💡 <b>Sfat:</b><br>
                            • Asigură-te că lumina este bună.<br>
                            • Încearcă să introduci codul manual folosind căsuța de mai sus.
                        </div>
                    </div>`;
            }
        } catch (e) {
            out.innerHTML = `<div class="result">❌ <b>Eroare de conexiune.</b> Te rugăm să verifici dacă ești conectat la internet.</div>`;
        }
    }
</script>
</body>
</html>
