<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SafeFood Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root {
            --bg: #1A1A1F; --bg2: #141418; --surface: #222228; --card: #2A2A32;
            --green: #00D68F; --red: #FF4757; --yellow: #FFB830; --orange: #FF6B35;
            --text: #EAEAF0; --text2: #A0A0B0; --text3: #6B6B80; --accent: #7C6FEA;
            --border: rgba(255,255,255,0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg2); color: var(--text); }
        .app { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { background: var(--bg); padding: 40px 20px 15px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo-text { font-family: 'Space Mono', monospace; font-size: 1.2rem; font-weight: 700; }
        .logo-text .safe { color: var(--green); }
        
        .tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--border); }
        .tab { flex: 1; padding: 15px; font-size: 0.7rem; font-weight: 700; color: var(--text3); background: none; border: none; cursor: pointer; text-transform: uppercase; }
        .tab.active { color: var(--green); border-bottom: 2px solid var(--green); }

        .content { padding: 16px; flex: 1; }
        .search-card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 15px; }
        .barcode-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .barcode-input { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: #fff; outline: none; }
        .search-go { background: var(--green); color: #000; border: none; border-radius: 10px; padding: 0 20px; font-weight: 700; }
        
        .cam-btn { width: 100%; background: var(--surface); border: 1px solid var(--green); border-radius: 12px; padding: 15px; color: var(--green); font-weight: 600; cursor: pointer; }

        /* Stil pentru zona de camera */
        #scanner-container { display: none; width: 100%; border-radius: 15px; overflow: hidden; position: relative; background: #000; margin-bottom: 15px; }
        #scanner-container video { width: 100%; height: auto; }
        .scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70%; height: 40%; border: 2px solid var(--green); border-radius: 10px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); pointer-events: none; }
        .stop-btn { position: absolute; top: 10px; right: 10px; background: var(--red); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; z-index: 10; }

        .result-card { background: var(--card); border-radius: 16px; padding: 20px; margin-top: 15px; border: 1px solid var(--border); }
        .grade-badge { display: inline-block; padding: 10px 20px; border-radius: 10px; font-size: 2rem; font-weight: 900; margin-bottom: 10px; }
        .grade-a { background: var(--green); color: #000; }
        .grade-e { background: var(--red); color: #fff; }
        .loading { text-align: center; padding: 20px; color: var(--green); }
    </style>
</head>
<body>

<div class="app">
    <header>
        <div class="logo-text"><span class="safe">Safe</span>Food Pro</div>
    </header>

    <div class="tabs">
        <button class="tab active">Scanner</button>
        <button class="tab">Bază Date</button>
    </div>

    <div class="content">
        <div class="search-card">
            <div class="barcode-row">
                <input type="text" id="manual-input" class="barcode-input" placeholder="Cod bare (ex: 5449000000996)">
                <button class="search-go" onclick="runSearch(document.getElementById('manual-input').value)">GO</button>
            </div>
            <button class="cam-btn" onclick="startScanner()">📷 SCANEAZĂ COD DE BARE</button>
        </div>

        <div id="scanner-container">
            <button class="stop-btn" onclick="stopScanner()">STOP</button>
            <div id="interactive" class="viewport"></div>
            <div class="scan-overlay"></div>
        </div>

        <div id="result-area"></div>
    </div>
</div>

<script>
    // Configurare Scanner
    function startScanner() {
        document.getElementById('scanner-container').style.display = 'block';
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector('#interactive'),
                constraints: { facingMode: "environment" }
            },
            decoder: { readers: ["ean_reader", "ean_8_reader", "upc_reader"] }
        }, function(err) {
            if (err) { alert("Eroare camera: " + err); return; }
            Quagga.start();
        });

        Quagga.onDetected(function(data) {
            let code = data.codeResult.code;
            stopScanner();
            runSearch(code);
        });
    }

    function stopScanner() {
        Quagga.stop();
        document.getElementById('scanner-container').style.display = 'none';
    }

    // Căutare în OpenFoodFacts
    async function runSearch(code) {
        if(!code) return;
        const resArea = document.getElementById('result-area');
        resArea.innerHTML = '<div class="loading">Se caută produsul...</div>';

        try {
            const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
            const data = await response.json();

            if (data.status === 1) {
                const p = data.product;
                const score = (p.nutrition_grades || 'C').toUpperCase();
                resArea.innerHTML = `
                    <div class="result-card">
                        <div class="grade-badge grade-${score.toLowerCase()}">${score}</div>
                        <h2>${p.product_name || 'Produs Necunoscut'}</h2>
                        <p style="color: var(--text2)">Brand: ${p.brands || 'N/A'}</p>
                        <hr style="margin: 15px 0; opacity: 0.1">
                        <p><strong>Ingrediente:</strong> ${p.ingredients_text_ro || p.ingredients_text || 'Informație indisponibilă'}</p>
                    </div>
                `;
            } else {
                resArea.innerHTML = '<div class="result-card">❌ Produsul nu a fost găsit.</div>';
            }
        } catch (e) {
            resArea.innerHTML = '<div class="result-card">❌ Eroare de conexiune.</div>';
        }
    }
</script>

</body>
</html>
