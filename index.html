<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <title>SafeFood Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root { --bg: #0A0A0C; --card: #16161D; --green: #00D68F; --red: #FF4757; --text: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
        header { padding: 25px; display: flex; justify-content: center; border-bottom: 1px solid #222; }
        .logo-img { width: 60px; height: 60px; border-radius: 15px; object-fit: cover; }
        .content { padding: 20px; max-width: 500px; margin: 0 auto; }
        .guide { background: rgba(0,214,143,0.05); border: 1px dashed var(--green); border-radius: 15px; padding: 15px; margin-bottom: 20px; font-size: 0.85rem; }
        .scan-btn { width: 100%; background: var(--green); color: #000; border: none; border-radius: 15px; padding: 20px; font-weight: 800; font-size: 1.1rem; cursor: pointer; }
        .res-card { background: var(--card); border-radius: 20px; padding: 25px; margin-top: 20px; animation: fadeIn 0.3s ease; }
        .badge { display: inline-block; padding: 5px 15px; border-radius: 8px; background: var(--green); color: #000; font-weight: 900; margin-bottom: 10px; }
        .warning { background: rgba(255, 71, 87, 0.1); border-left: 4px solid var(--red); padding: 12px; margin-top: 10px; border-radius: 5px; }
        #scanner-container { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; }
        #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
        .laser { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 250px; height: 2px; background: var(--red); box-shadow: 0 0 10px var(--red); animation: move 2s infinite; }
        @keyframes move { 0%, 100% { top: 40%; } 50% { top: 60%; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<header><img src="logo.png" class="logo-img"></header>

<div class="content">
    <div class="guide">
        <strong style="color:var(--green)">🛡️ Ghid Rapid:</strong><br>
        1. Scanează produsul.<br>
        2. Verifică scorul A-E.<br>
        3. Citește avertismentele medicale.
    </div>

    <button class="scan-btn" onclick="startScan()">📷 SCANEAZĂ PRODUS</button>
    <div id="out"></div>
</div>

<div id="scanner-container">
    <div id="interactive" class="viewport"></div>
    <div class="laser"></div>
    <button onclick="stopScan()" style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); padding:15px 30px; border-radius:30px; border:none; font-weight:bold;">ÎNCHIDE</button>
</div>

<script>
    const toxicDB = [
        { kw: ['zahar', 'zahăr', 'sugar', 'zucker', 'sirop'], msg: "⚠️ Zahăr Ridicat: Risc de diabet și obezitate." },
        { kw: ['taurin', 'taurine'], msg: "⚡ Taurină: Suprasolicită inima." },
        { kw: ['chinin', 'quinine'], msg: "⚠️ Chinină: Poate cauza aritmii." }
    ];

    function startScan() {
        document.getElementById('scanner-container').style.display = 'block';
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#interactive'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "upc_reader"] }
        }, (err) => { if(!err) Quagga.start(); });
        Quagga.onDetected((res) => { stopScan(); fetchData(res.codeResult.code); });
    }

    function stopScan() { Quagga.stop(); document.getElementById('scanner-container').style.display = 'none'; }

    async function fetchData(code) {
        const out = document.getElementById('out');
        out.innerHTML = "<p style='text-align:center; padding:20px;'>🔍 Se caută...</p>";
        try {
            const r = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
            const d = await r.json();
            if (d.status === 1) {
                const p = d.product;
                const ing = (p.ingredients_text || "").toLowerCase();
                let warnHTML = "";
                toxicDB.forEach(t => { if(t.kw.some(k => ing.includes(k))) warnHTML += `<div class="warning">${t.msg}</div>`; });
                
                out.innerHTML = `
                    <div class="res-card">
                        <div class="badge">SCOR: ${(p.nutrition_grades || "N/A").toUpperCase()}</div>
                        <h2>${p.product_name || 'Produs'}</h2>
                        <p style="color:var(--green)">${p.brands || ''}</p>
                        ${warnHTML || '<p style="margin-top:10px;">✅ Nu s-au găsit substanțe nocive majore.</p>'}
                    </div>`;
            } else { out.innerHTML = "<p>❌ Produs negăsit.</p>"; }
        } catch (e) { out.innerHTML = "<p>Eroare de conexiune.</p>"; }
    }
</script>
</body>
</html>
