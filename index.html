<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SafeFood Pro | Premium Scanner</title>
    
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p-green: #2ecc71;
            --p-dark: #0f172a;
            --p-glass: rgba(255, 255, 255, 0.08);
            --p-border: rgba(255, 255, 255, 0.1);
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LOADING SCREEN / SPLASH --- */
        #splash {
            position: fixed; inset: 0; z-index: 1000;
            background: linear-gradient(180deg, #166534 0%, #064e3b 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.6s ease;
        }

        .logo-container {
            text-align: center;
            animation: fadeInScale 1s ease-out;
        }

        .shield-logo {
            width: 100px; height: 100px; background: var(--p-glass);
            border: 2px solid var(--p-green); border-radius: 28px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px; backdrop-filter: blur(10px);
        }

        /* --- APP STRUCTURE --- */
        .app-container { display: none; height: 100vh; flex-direction: column; }
        .app-container.active { display: flex; }

        /* --- SCANNER VIEW --- */
        #scanner-view { position: relative; flex: 1; overflow: hidden; background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; }

        .scan-overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3);
        }

        .reticle {
            width: 280px; height: 180px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 24px; position: relative;
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .reticle::before {
            content: ''; position: absolute; width: 100%; height: 4px;
            background: var(--p-green); box-shadow: 0 0 20px var(--p-green);
            animation: scanMove 2.5s infinite ease-in-out;
        }

        @keyframes scanMove {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        /* --- BOTTOM NAVIGATION (Claude Style) --- */
        .nav-bar {
            height: calc(85px + var(--safe-area-bottom));
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--p-border);
            display: grid; grid-template-columns: repeat(5, 1fr);
            padding-bottom: var(--safe-area-bottom);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; color: #94a3b8; gap: 5px; cursor: pointer;
        }

        .nav-item.active { color: var(--p-green); }

        .scan-btn-main {
            width: 55px; height: 55px; background: var(--p-green);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            margin-top: -30px; box-shadow: 0 10px 25px rgba(46, 204, 113, 0.4);
        }

        /* --- PRODUCT SHEET (Premium Glass) --- */
        #product-sheet {
            position: fixed; bottom: 0; width: 100%; height: 85vh;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(30px);
            border-top: 1px solid var(--p-border);
            border-radius: 40px 40px 0 0;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.33, 1, 0.68, 1);
            z-index: 500; overflow-y: auto; padding: 30px;
        }

        #product-sheet.open { transform: translateY(0); }

        .score-circle {
            width: 90px; height: 90px; border-radius: 50%;
            margin: 20px auto; display: flex; align-items: center; justify-content: center;
            font-size: 40px; font-weight: 800; border: 4px solid var(--p-border);
        }

        .warning-box {
            background: rgba(239, 68, 68, 0.15);
            border-left: 4px solid #ef4444;
            padding: 15px; border-radius: 12px; margin: 20px 0;
            display: flex; align-items: center; gap: 10px;
        }

        /* --- SCORING COLORS --- */
        .score-A { background: #166534; color: #fff; box-shadow: 0 0 30px rgba(22, 101, 52, 0.5); }
        .score-B { background: #15803d; color: #fff; }
        .score-C { background: #ca8a04; color: #fff; }
        .score-D { background: #b91c1c; color: #fff; }
        .score-E { background: #7f1d1d; color: #fff; }

        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .info-card { background: var(--p-glass); padding: 15px; border-radius: 18px; border: 1px solid var(--p-border); }
        .info-card span { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; }
        .info-card strong { font-size: 16px; margin-top: 4px; display: block; }

    </style>
</head>
<body>

    <div id="splash" onclick="startApp()">
        <div class="logo-container">
            <div class="shield-logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
            </div>
            <h1 style="font-weight: 800; letter-spacing: -1px; font-size: 32px;">SafeFood Pro</h1>
            <p style="opacity: 0.6; font-size: 12px; margin-top: 10px; text-transform: uppercase; letter-spacing: 2px;">Mâncare Sigură • Viață Sănătoasă</p>
            <p style="margin-top: 40px; font-size: 14px; animation: pulse 2s infinite;">Atinge pentru a începe</p>
        </div>
    </div>

    <div id="app" class="app-container">
        <div style="padding: 60px 20px 20px; display: flex; justify-content: space-between; align-items: center;">
            <div id="status-dot" style="display:flex; align-items:center; gap:8px; font-size: 12px; color: #94a3b8;">
                <span style="width:8px; height:8px; background:var(--p-green); border-radius:50%;"></span> Camera Activă
            </div>
            <div style="width: 40px; height: 40px; border-radius: 12px; background: var(--p-glass); display: flex; align-items: center; justify-content: center;">👤</div>
        </div>

        <div id="scanner-view">
            <video id="video"></video>
            <div class="scan-overlay">
                <div class="reticle"></div>
                <p style="margin-top: 30px; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">Scanează codul de bare</p>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item"><span>🕒</span>Istoric</div>
            <div class="nav-item"><span>❤️</span>Favorite</div>
            <div class="nav-item active">
                <div class="scan-btn-main">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path>
                    </svg>
                </div>
                <span>Scanează</span>
            </div>
            <div class="nav-item"><span>📖</span>Ghid</div>
            <div class="nav-item" onclick="location.reload()"><span>⚙️</span>Setări</div>
        </div>
    </div>

    <div id="product-sheet">
        <div style="width: 50px; height: 5px; background: var(--p-border); border-radius: 10px; margin: 0 auto 30px;" onclick="closeSheet()"></div>
        
        <div id="sheet-content">
            <div style="text-align: center;">
                <img id="p-img" src="" style="width: 150px; height: 150px; object-fit: contain; border-radius: 20px; background: #fff; padding: 10px; margin-bottom: 20px;">
                <h2 id="p-name" style="font-size: 24px; font-weight: 800;">Nume Produs</h2>
                <p id="p-brand" style="color: var(--p-green); font-weight: 600; margin-top: 5px;">Brand</p>
            </div>

            <div id="p-score-badge" class="score-circle">?</div>
            
            <div id="p-warning" class="warning-box">
                <span style="font-size: 24px;">⚠️</span>
                <p id="p-warning-text" style="font-size: 14px; font-weight: 600;">Analiză în curs...</p>
            </div>

            <div class="grid-info">
                <div class="info-card"><span>Zaharuri</span><strong id="v-sugar">-</strong></div>
                <div class="info-card"><span>Sare</span><strong id="v-salt">-</strong></div>
                <div class="info-card"><span>Grăsimi</span><strong id="v-fat">-</strong></div>
                <div class="info-card"><span>E-uri</span><strong id="v-additives">-</strong></div>
            </div>

            <div style="margin-top: 30px;">
                <h4 style="margin-bottom: 10px; font-size: 14px; color: #94a3b8;">INGREDIENTE</h4>
                <p id="p-ingred" style="font-size: 13px; line-height: 1.6; color: #cbd5e1;"></p>
            </div>

            <button onclick="closeSheet()" style="width:100%; padding: 18px; border-radius: 20px; border: none; background: var(--p-green); color: white; font-weight: 800; margin-top: 30px; box-shadow: 0 10px 20px rgba(46, 204, 113, 0.3);">SCANARE NOUĂ</button>
        </div>
    </div>

    <script>
        const codeReader = new ZXing.BrowserMultiFormatReader();
        let isScanning = false;

        function startApp() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').classList.add('active');
                initCamera();
            }, 600);
        }

        async function initCamera() {
            try {
                const videoInputDevices = await codeReader.listVideoInputDevices();
                const selectedDeviceId = videoInputDevices[0].deviceId;
                
                codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                    if (result && !isScanning) {
                        isScanning = true;
                        handleProductFound(result.text);
                    }
                });
            } catch (err) {
                alert("Eroare Camera: Te rugăm să permiți accesul.");
            }
        }

        async function handleProductFound(barcode) {
            // Feedback Haptic & Sound
            window.navigator.vibrate?.(150);
            playSuccessSound();

            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                const data = await res.json();

                if (data.status === 1) {
                    displayProduct(data.product);
                } else {
                    alert("Produsul nu a fost găsit.");
                    isScanning = false;
                }
            } catch (e) {
                alert("Eroare conexiune baza de date.");
                isScanning = false;
            }
        }

        function displayProduct(p) {
            document.getElementById('p-name').textContent = p.product_name || 'Produs fără nume';
            document.getElementById('p-brand').textContent = p.brands || 'Brand generic';
            document.getElementById('p-img').src = p.image_url || 'https://via.placeholder.com/200';
            
            // Nutriscore
            const score = (p.nutriscore_grade || 'c').toUpperCase();
            const badge = document.getElementById('p-score-badge');
            badge.className = `score-circle score-${score}`;
            badge.textContent = score;

            // Warning Logic (Simulată din Date)
            const sugar = p.nutriments?.sugars_100g || 0;
            const warningText = document.getElementById('p-warning-text');
            const warningBox = document.getElementById('p-warning');

            if (sugar > 20) {
                warningText.textContent = "Zahăr Ridicat: Risc de diabet și obezitate.";
                warningBox.style.display = 'flex';
            } else if (score === 'A' || score === 'B') {
                warningText.textContent = "Alegere excelentă: Produs nutritiv și sigur.";
                warningBox.style.borderColor = "#2ecc71";
                warningBox.style.background = "rgba(46, 204, 113, 0.1)";
            } else {
                warningText.textContent = "Consumă cu moderație.";
                warningBox.style.borderColor = "#ca8a04";
                warningBox.style.background = "rgba(202, 138, 4, 0.1)";
            }

            // Stats
            document.getElementById('v-sugar').textContent = sugar + "g";
            document.getElementById('v-salt').textContent = (p.nutriments?.salt_100g || 0) + "g";
            document.getElementById('v-fat').textContent = (p.nutriments?.fat_100g || 0) + "g";
            document.getElementById('v-additives').textContent = p.additives_n || 0;
            document.getElementById('p-ingred').textContent = p.ingredients_text_ro || p.ingredients_text || "Ingrediente necompletate.";

            document.getElementById('product-sheet').classList.add('open');
        }

        function closeSheet() {
            document.getElementById('product-sheet').classList.remove('open');
            setTimeout(() => { isScanning = false; }, 500);
        }

        function playSuccessSound() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            const gain = context.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, context.currentTime);
            gain.gain.setValueAtTime(0.1, context.currentTime);
            osc.connect(gain);
            gain.connect(context.destination);
            osc.start();
            osc.stop(context.currentTime + 0.1);
        }
    </script>
</body>
</html>
