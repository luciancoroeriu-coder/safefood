<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SafePro Pro</title>
    
    <link rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        :root { --bg: #0A0A0C; --card: #16161D; --green: #00D68F; --yellow: #FFD166; --orange: #FF8C42; --red: #FF4757; --text: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
        
        header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: center; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 100; }
        .logo-img { width: 55px; height: 55px; border-radius: 14px; object-fit: cover; }
        .fallback-shield { width: 55px; height: 55px; border-radius: 14px; background: rgba(0,214,143,0.1); border: 2px solid var(--green); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        
        .lang-btn { position: absolute; right: 20px; background: #222; color: var(--green); border: 1px solid var(--green); padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .content { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* GHID & LEGENDA - RECONSTRUITE */
        .guide-box { background: rgba(0, 214, 143, 0.05); border: 1px dashed rgba(0, 214, 143, 0.3); border-radius: 18px; padding: 20px; margin-bottom: 25px; }
        .legend-box { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; font-weight: 600; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }

        .scan-btn { width: 100%; background: var(--green); color: #000; border: none; border-radius: 18px; padding: 20px; font-weight: 800; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .input-row { display: flex; gap: 10px; margin-top: 20px; }
        .input-row input { flex: 1; background: #111; border: 1px solid #333; padding: 16px; border-radius: 12px; color: #fff; outline: none; }
        .go-btn { background: #222; color: var(--green); border: 1px solid var(--green); padding: 0 20px; border-radius: 12px; font-weight: bold; }

        /* REZULTATE */
        .res-card { background: var(--card); border-radius: 24px; padding: 25px; margin-top: 25px; border: 1px solid rgba(255,255,255,0.05); animation: fadeIn 0.3s ease; }
        .badge { display: inline-block; padding: 8px 18px; border-radius: 10px; font-weight: 900; color: #000; margin-bottom: 15px; }
        .grade-a, .grade-b { background: var(--green); }
        .grade-c { background: var(--yellow); }
        .grade-d { background: var(--orange); }
        .grade-e { background: var(--red); color: #fff; }

        /* AVERTISMENTE MEDICALE */
        .warning-item { background: rgba(255, 71, 87, 0.08); border-left: 4px solid var(--red); padding: 15px; margin-bottom: 10px; border-radius: 0 12px 12px 0; }
        .warning-name { color: var(--red); font-weight: bold; font-size: 0.95rem; }
        .warning-desc { font-size: 0.85rem; color: #ddd; margin-top: 4px; }
        .safe-msg { background: rgba(0, 214, 143, 0.1); color: var(--green); padding: 15px; border-radius: 12px; font-weight: bold; text-align: center; }

        /* CAMERA PRO */
        #scanner-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        #interactive.viewport video { width: 100%; height: 100%; object-fit: cover; }
        .reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 180px; border: 3px solid var(--green); border-radius: 20px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); overflow: hidden; }
        .laser { width: 100%; height: 3px; background: var(--red); position: absolute; top: 0; box-shadow: 0 0 15px var(--red); animation: scan 2s infinite ease-in-out; }
        .close-cam { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 15px 40px; border-radius: 30px; font-weight: bold; border: none; }

        @keyframes scan { 0% { top: 5%; } 50% { top: 95%; } 100% { top: 5%; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <img id="logo" src="logo.png" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback').style.display='flex';">
    <div id="fallback" class="fallback-shield" style="display:none;">🛡️</div>
    <button class="lang-btn" onclick="cycleLang()" id="langBtn">RO</button>
</header>

<div class="content">
    <div class="guide-box">
        <h4 id="ui-g-title" style="color:var(--green); margin-bottom:10px;">🛡️ Ghid Clasificare</h4>
        <div id="ui-g-text" style="font-size:0.85rem; color:#ccc; margin-bottom:15px;"></div>
        <div class="legend-box" id="ui-legend"></div>
    </div>

    <button class="scan-btn" onclick="openCam()">
        📷 <span id="ui-scan-btn">SCANEAZĂ PRODUS</span>
    </button>
    
    <div class="input-row">
        <input type="number" id="manualInput" placeholder="Cod manual...">
        <button class="go-btn" onclick="fetchData(document.getElementById('manualInput').value)">GO</button>
    </div>

    <div id="out"></div>
</div>

<div id="scanner-container">
    <div id="interactive" class="viewport"></div>
    <div class="reticle"><div class="laser"></div></div>
    <button class="close-cam" onclick="closeCam()">ÎNCHIDE</button>
</div>

<script>
    // Fortam logo-ul sa se reincarce
    document.getElementById('logo').src = 'logo.png?v=' + Date.now();

    const i18n = {
        RO: {
            gText: "1. Scanează codul.<br>2. Verifică scorul colorat.<br>3. Citește avertismentele medicale.",
            legA: "Clasa A/B: Sănătos", legC: "Clasa C: Moderat", legD: "Clasa D: Nerecomandat", legE: "Clasa E: Nociv",
            scan: "SCANEAZĂ PRODUS", search: "🔍 Analizăm...", none: "Nicio substanță nocivă detectată! ✅", med: "ANALIZĂ MEDICALĂ:", ing: "Etichetă brută:", close: "ÎNCHIDE"
        },
        EN: {
            gText: "1. Scan barcode.<br>2. Check color score.<br>3. Read medical warnings.",
            legA: "Class A/B: Healthy", legC: "Class C: Moderate", legD: "Class D: Avoid daily", legE: "Class E: Harmful",
            scan: "SCAN PRODUCT", search: "🔍 Analyzing...", none: "No harmful substances detected! ✅", med: "MEDICAL ANALYSIS:", ing: "Raw label:", close: "CLOSE"
        }
    };

    const toxicDB = [
        { kw: ['zahar', 'zahăr', 'sugar', 'zucker', 'sirop', 'glucose'], ro: "⚠️ Zahăr: Risc de diabet și obezitate.", en: "⚠️ High Sugar: Diabetes & obesity risk." },
        { kw: ['chinin', 'quinine'], ro: "⚠️ Chinină: Risc de aritmii. Evitați în sarcină.", en: "⚠️ Quinine: Heart arrhythmia risk." },
        { kw: ['taurin', 'taurine'], ro: "⚡ Taurină: Suprasolicită inima.", en: "⚡ Taurine: Heart strain risk." },
        { kw: ['e102', 'e129', 'colorant', 'dye'], ro: "🧪 Coloranți: Risc de ADHD la copii.", en: "🧪 Dyes: ADHD risk in children." },
        { kw: ['e202', 'e211', 'sorbat', 'benzoat'], ro: "⚠️ Conservanți: Pot cauza alergii severe.", en: "⚠️ Preservatives: Allergy risk." }
    ];

    let curLang = 'RO';
    function updateUI() {
        const t = i18n[curLang];
        document.getElementById('langBtn').innerText = curLang;
        document.getElementById('ui-g-text').innerHTML = t.gText;
        document.getElementById('ui-scan-btn').innerText = t.scan;
        document.getElementById('ui-legend').innerHTML = `
            <div class="legend-item"><div class="dot" style="background:var(--green)"></div> ${t.legA}</div>
            <div class="legend-item"><div class="dot" style="background:var(--yellow)"></div> ${t.legC}</div>
            <div class="legend-item"><div class="dot" style="background:var(--orange)"></div> ${t.legD}</div>
            <div class="legend-item"><div class="dot" style="background:var(--red)"></div> ${t.legE}</div>
        `;
    }

    function cycleLang() { curLang = curLang === 'RO' ? 'EN' : 'RO'; updateUI(); }

    function openCam() {
        document.getElementById('scanner-container').style.display = 'block';
        Quagga.init({
            inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#interactive'), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "upc_reader", "code_128_reader"] }
        }, (err) => { if(!err) Quagga.start(); });
        Quagga.onDetected((res) => { 
            if (navigator.vibrate) navigator.vibrate(50);
            closeCam(); fetchData(res.codeResult.code); 
        });
    }

    function closeCam() { Quagga.stop(); document.getElementById('scanner-container').style.display = 'none'; }

    async function fetchData(code) {
        const out = document.getElementById('out');
        const t = i18n[curLang];
        out.innerHTML = `<div class="res-card" style="text-align:center;">${t.search}</div>`;

        const apis = [
            `https://world.openfoodfacts.org/api/v0/product/${code}.json`,
            `https://world.openbeautyfacts.org/api/v0/product/${code}.json`,
            `https://world.openproductsfacts.org/api/v0/product/${code}.json`
        ];

        let p = null;
        for (let url of apis) {
            try { let r = await fetch(url); let d = await r.json(); if(d.status === 1) { p = d.product; break; } } catch(e){}
        }

        if(!p) { out.innerHTML = `<div class="res-card">❌ Produs negăsit.</div>`; return; }

        const ing = (p.ingredients_text_ro || p.ingredients_text || "").toLowerCase();
        let toxHTML = "";
        toxicDB.forEach(tox => {
            if(tox.kw.some(k => ing.includes(k))) {
                toxHTML += `<div class="warning-item"><div class="warning-name">${curLang === 'RO' ? tox.ro : tox.en}</div></div>`;
            }
        });

        const grade = (p.nutrition_grades || "N/A").toUpperCase();
        let gClass = "grade-unknown";
        if(['A','B'].includes(grade)) gClass = "grade-a";
        if(grade === 'C') gClass = "grade-c";
        if(grade === 'D') gClass = "grade-d";
        if(grade === 'E') gClass = "grade-e";

        out.innerHTML = `
            <div class="res-card">
                <div class="badge ${gClass}">SCOR: ${grade}</div>
                <h2>${p.product_name || 'Produs'}</h2>
                <p style="color:var(--green); font-weight:bold; margin-bottom:15px;">${p.brands || ''}</p>
                <p style="font-size:0.8rem; font-weight:bold;">${t.med}</p>
                ${toxHTML || `<div class="safe-msg">${t.none}</div>`}
                <div class="raw-ingredients"><strong>${t.ing}</strong><br>${ing || 'N/A'}</div>
            </div>`;
    }

    updateUI(); // Pornire corectă
</script>
</body>
</html>
